<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F1F0EC">
<meta name="description" content="A content portal for technical companies. Early access is invite only.">
<meta name="author" content="Ghostwriter Mom">
<title>Ghostwriter Mom | Waitlist</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap');
@font-face{font-family:"Palatino Brand";src:url("fonts/pala.ttf") format("truetype");font-weight:400 700;font-display:swap;}
:root{
  --canvas:#F1F0EC; --ink:#0E0E0E; --ink-pill:#171717; --grey-body:#6a6a6a;
  --accent:#B8FF71; --accent-ink:#245C15;
  --glow:conic-gradient(from 180deg,#ff6ec7,#ffd36e,#b8ff71,#6ee7ff,#9d7bff,#ff6ec7);
  --font-display:"Inter Tight","Neue Haas Grotesk Display",system-ui,sans-serif;
  --font-accent:"Palatino Brand",Georgia,serif;
  --font-body:"Inter Tight",system-ui,sans-serif;
  --font-mono:ui-monospace,"SF Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --ease:cubic-bezier(0.22,1,0.36,1);
  --radius-pill:999px;
  --dur:220ms;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{
  background-color:var(--canvas);
  background-image:
    repeating-linear-gradient(0deg, rgba(14,14,14,0.020) 0 1px, transparent 1px 27px),
    repeating-linear-gradient(90deg, rgba(14,14,14,0.020) 0 1px, transparent 1px 27px),
    radial-gradient(62% 52% at 16% 20%, rgba(255,255,255,0.85), transparent 62%),
    radial-gradient(54% 46% at 84% 78%, rgba(14,14,14,0.028), transparent 58%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:var(--font-body);
  min-height:100vh; min-height:100dvh;
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
}
main{
  min-height:100vh; min-height:100dvh;
  display:flex; flex-direction:column;
  padding:24px clamp(18px,4vw,32px) max(24px,env(safe-area-inset-bottom,24px));
}
.brandmark{
  font-family:var(--font-display); font-weight:800;
  font-size:13px; letter-spacing:0.02em; text-transform:uppercase;
  color:var(--ink); display:inline-flex; align-items:center; gap:6px;
}
.brandmark .reg{font-weight:600; font-size:9px; vertical-align:super; color:#6a6a6a;}
.hero{
  flex:1; display:flex; flex-direction:column; justify-content:center;
  gap:14px; max-width:640px; margin:0 auto; width:100%;
}
.headline{
  font-family:var(--font-display); font-weight:800;
  font-size:clamp(30px, 6.4vw, 46px);
  letter-spacing:-0.025em; line-height:1.08;
  color:var(--ink); margin:0; text-wrap:balance;
}
.headline em{
  font-family:var(--font-accent); font-style:italic; font-weight:700;
  letter-spacing:0;
}
.lede{
  font-family:var(--font-body); font-size:clamp(15px,2vw,17px); font-weight:400;
  line-height:1.55; color:#333; max-width:560px; margin:0; text-wrap:balance;
}
.capture{margin-top:14px; display:flex; flex-direction:column; align-items:stretch; gap:10px; max-width:520px; width:100%;}
.field{
  position:relative; display:flex; align-items:stretch; width:100%;
  background:#fff; border:1px solid rgba(14,14,14,0.10); border-radius:22px;
  padding:6px; gap:6px;
  box-shadow:0 18px 50px -34px rgba(14,14,14,0.5);
}
.field input{
  flex:1; border:none; outline:none; background:transparent;
  font-family:var(--font-body); font-size:15px; color:var(--ink);
  padding:14px 16px; min-height:48px; min-width:0; border-radius:16px;
}
.field input::placeholder{color:var(--grey-body); font-family:var(--font-body); font-size:15px; opacity:1;}
.field input:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.join-host{position:relative; display:inline-flex; isolation:isolate;}
.join-glow{
  position:absolute; inset:-6px -10px; z-index:-1;
  border-radius:var(--radius-pill);
  background:var(--glow); filter:blur(17px); opacity:0;
  transition:opacity 360ms var(--ease);
  pointer-events:none;
}
.join-host:hover .join-glow{opacity:0.95; animation:glow-breathe 5.5s ease-in-out infinite;}
@keyframes glow-breathe{0%,100%{opacity:0.78; transform:scale(1);} 50%{opacity:0.97; transform:scale(1.04);}}
.join{
  display:inline-flex; align-items:center; justify-content:center; gap:10px;
  border:none; background:var(--ink-pill); color:#fff;
  font-family:var(--font-body); font-weight:600; font-size:14px;
  padding:14px 22px; min-height:48px; border-radius:var(--radius-pill);
  cursor:pointer;
  transition:transform var(--dur) var(--ease), filter var(--dur) var(--ease);
}
.join:hover{transform:scale(1.02); filter:brightness(1.1);}
.join:active{transform:scale(0.99);}
.join:disabled{opacity:0.5; cursor:default; transform:none;}
.join .arr{
  display:inline-flex; align-items:center; justify-content:center;
  width:22px; height:22px; border-radius:50%; background:rgba(255,255,255,0.14);
  font-size:13px; flex:0 0 22px;
}
@media (min-width:640px){
  .field{flex-direction:row; padding:7px 7px 7px 22px; border-radius:var(--radius-pill);}
  .field input{padding:12px 8px; border-radius:0; min-height:44px;}
  .join{padding:14px 22px; font-size:13.5px; white-space:nowrap;}
}
.err{
  font-family:var(--font-mono); font-size:12px; color:#8a1a1a;
  min-height:16px; margin:0 4px;
}
.ack{
  font-family:var(--font-body); font-size:15px; line-height:1.5; color:var(--ink);
  margin:0; padding:14px 16px;
  background:rgba(184,255,113,0.28);
  border:1px solid rgba(184,255,113,0.55); border-radius:16px;
  display:none;
}
.ack.on{display:block;}
.form-hp{position:absolute; left:-10000px; top:auto; width:1px; height:1px; overflow:hidden;}
.footer{
  font-family:var(--font-mono); font-size:11px; letter-spacing:0.14em;
  text-transform:uppercase; color:#6a6a6a; margin-top:24px;
}
@media (prefers-reduced-motion:reduce){
  *, *::before, *::after{animation:none !important; transition:none !important;}
}
</style>
</head>
<body>
<main>
  <div class="brandmark">Ghostwriter Mom<span class="reg">&reg;</span></div>

  <section class="hero">
    <h1 class="headline">No <em>brief</em>, no prompt. Just content that ranks.</h1>
    <p class="lede">A content portal for technical companies. Early access is invite only.</p>

    <!--
      Netlify picks up this <form> at deploy time. The active form on the
      dashboard is called "join-waitlist".
    -->
    <form id="waitlist-form" class="capture"
          name="join-waitlist" method="POST"
          data-netlify="true" netlify-honeypot="bot-field"
          action="/?waitlisted=1">
      <input type="hidden" name="form-name" value="join-waitlist">
      <input type="hidden" name="submitted-at" id="wl-submitted-at" value="">
      <input type="hidden" name="submitted-tz" id="wl-submitted-tz" value="">
      <p class="form-hp"><label>Don't fill this out if you're human: <input name="bot-field"></label></p>

      <label class="field" for="wl-email" aria-label="Email address">
        <input id="wl-email" name="email" type="email"
               placeholder="you@work.com"
               autocomplete="email" inputmode="email" required>
        <span class="join-host">
          <span class="join-glow" aria-hidden="true"></span>
          <button type="submit" class="join">
            Join the waitlist
            <span class="arr" aria-hidden="true">&#8594;</span>
          </button>
        </span>
      </label>
      <p class="err" id="wl-err">&nbsp;</p>
      <p class="ack" id="wl-ack">On the list. I'll reach out when the next spot opens.</p>
    </form>
  </section>

  <p class="footer">Ghostwriter Mom &copy; <span id="year"></span></p>
</main>

<script>
(function(){
  'use strict';
  var yearEl = document.getElementById('year');
  if(yearEl) yearEl.textContent = String(new Date().getFullYear());

  var form  = document.getElementById('waitlist-form');
  var email = document.getElementById('wl-email');
  var err   = document.getElementById('wl-err');
  var ack   = document.getElementById('wl-ack');
  var atEl  = document.getElementById('wl-submitted-at');
  var tzEl  = document.getElementById('wl-submitted-tz');
  var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  // Show the ack if the user is bouncing back from a successful submit.
  if(new URLSearchParams(location.search).get('waitlisted') === '1'){
    ack.classList.add('on');
    if(email) email.value = '';
  }

  form.addEventListener('submit', function(e){
    var raw = (email.value || '').trim();
    email.value = raw;
    if(!EMAIL_RE.test(raw)){
      e.preventDefault();
      err.textContent = "That email address doesn't look right.";
      email.focus();
      return;
    }
    err.textContent = ' ';
    atEl.value = new Date().toISOString();
    try{ tzEl.value = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; }catch(_){}
    // Let the browser POST the form normally. Netlify's default success
    // redirect (action="/?waitlisted=1") reloads this page with the ack.
  });
})();
</script>
</body>
</html>
