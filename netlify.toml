headersOrigin = "config"
redirectsOrigin = "config"

[functions]

  [functions."*"]

[[plugins]]
origin = "ui"
package = "@netlify/plugin-lighthouse"
pinned_version = "6"

  [plugins.inputs]

[build]
publish = "/Users/vedikabhasin/Desktop/join-waitlist/project"
publishOrigin = "config"
commandOrigin = "config"
base = "/Users/vedikabhasin/Desktop/join-waitlist/project"
command = "node validate-feeds.js"

  [build.environment]

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]

[[headers]]
for = "/*"

  [headers.values]
  Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
  X-Frame-Options = "DENY"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin"
  Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

[[headers]]
for = "/clients/*"

  [headers.values]
  X-Robots-Tag = "noindex, nofollow, noarchive"
  Cache-Control = "no-store"

[[redirects]]
from = "/:slug"
to = "/swipe.html?slug=:slug"
status = 200
force = false

  [redirects.query]

  [redirects.conditions]

  [redirects.headers]