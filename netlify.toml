# Static site — no framework build. The build step runs a schema check on
# every /clients/*.json feed so a malformed pitch cannot ship.

[build]
  command = "node validate-feeds.js"
  publish = "."

# -----------------------------------------------------------------------------
# Routing (order matters — Netlify picks the first match)
# 1. Root -> waitlist (temporary 302; the root becomes a landing page later)
# 2. /waitlist        -> /waitlist.html rewrite
# 3. Internal-company slugs -> /portal 302 (one line per internal company)
# 4. /portal          -> /portal/index.html rewrite
# 5. /:slug           -> /swipe.html?slug=:slug catch-all for real client pitches
# -----------------------------------------------------------------------------

# 1. Root -> waitlist (temporary — status 302, not 301)
[[redirects]]
  from   = "/"
  to     = "/waitlist"
  status = 302
  force  = true

# 2. /waitlist serves waitlist.html (not the /index.html round-trip that
#    Netlify's pretty URLs would try to shorten back to /, which would loop
#    against rule 1). File is named waitlist.html on purpose.
[[redirects]]
  from   = "/waitlist"
  to     = "/waitlist.html"
  status = 200
  force  = true

# 3. Internal companies, one line each.
#    Each entry is /<generated-slug> -> /portal (302, force=true).
#    Add a line here after provisioning a new internal company (e.g. Vedika).
# [[redirects]]
#   from   = "/vedika-bhasin-XXXXXX"
#   to     = "/portal"
#   status = 302
#   force  = true
[[redirects]]
  from   = "/vedika-bhasin-ycfogw"
  to     = "/portal"
  status = 302
  force  = true

# 4. Member portal.
[[redirects]]
  from   = "/portal"
  to     = "/portal/index.html"
  status = 200
  force  = true

# 5. Real client slugs -> sales page. Catch-all, last.
[[redirects]]
  from   = "/:slug"
  to     = "/swipe.html?slug=:slug"
  status = 200
  force  = false

# -----------------------------------------------------------------------------
# Security headers
# CSP:
#   script-src  self + inline (small helpers) + esm.sh (Supabase JS import) +
#               cdnjs.cloudflare.com (GSAP) + PostHog's asset host.
#   style-src   self + inline + Google Fonts CSS (imported at the top of each
#               <style>).
#   font-src    self + gstatic.
#   img-src     self + data URIs.
#   connect-src self + every Supabase project host + PostHog ingest.
#   frame-ancestors 'none' + form-action 'self' + strict-origin referrer so
#               private pitch URLs never leak.
# The wildcard *.supabase.co covers the project's REST + Auth + Storage
# endpoints; the anon key alone bounded by RLS is what actually protects data.
# -----------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://esm.sh https://cdnjs.cloudflare.com https://us-assets.i.posthog.com https://eu-assets.i.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://us.i.posthog.com https://eu.i.posthog.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Frame-Options       = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Client feeds should never be listed or crawled directly. The catch-all is
# behind server-side X-Robots-Tag as belt and suspenders to the meta tag on
# swipe.html. Internal-company feeds (e.g. vedika-bhasin.json) are also here
# and inherit the same X-Robots + no-store.
[[headers]]
  for = "/clients/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"
