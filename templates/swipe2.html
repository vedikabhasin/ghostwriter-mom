       * slug from ?slug= (the _redirects rewrite) or the first path segment
       * the slug config from /clients/<slug>.json (template must be "swipe2")
       * PostHog through /shared/track.js: template, slug, lead_type,
         cards_count and flow are registered on every event; page_open fires
         on load. The other shared events (deal_me_in, first_swipe,
         swipe_complete, email_submitted, unlock_clicked) go through
         window.gwmTrack.capture(name, props) once the flow exists.
     Copy rules: no RPR terms (pillar, insight article), no em dashes.

<style>
@import url('/styles/tokens.css');
@import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;800&display=swap');
:root{ --canvas:#F1F0EC; --ink:#0E0E0E; }
html,body{margin:0; background:var(--canvas); color:var(--ink); font-family:"Inter Tight", system-ui, sans-serif;}
.shell{max-width:480px; margin:0 auto; padding:48px 24px;}
.eyebrow{font:500 13px/1 ui-monospace, monospace; letter-spacing:0.18em; text-transform:uppercase; opacity:0.7; margin:0 0 12px;}
h1{font-size:32px; line-height:1.1; margin:0 0 12px;}
p{font-size:17px; line-height:1.5; margin:0;}
</style>
</head>
<body>
<main class="shell" id="swipe2-root">
  <p class="eyebrow">swipe2 template</p>
  <h1 id="swipe2-company">Loading</h1>
  <p id="swipe2-status">This template is a scaffold. The flow is not built yet.</p>
</main>
<script type="module">
  import * as T from '/shared/track.js';
  window.gwmTrack = T;

  const TEMPLATE = 'swipe2';
  function resolveSlug(){
    const q = new URLSearchParams(location.search).get('slug');
    if (q) return q.replace(/[^a-z0-9_-]/gi, '').toLowerCase();
    return (location.pathname.replace(/^\/+/, '').split('/')[0] || '').toLowerCase();
  }
  const SLUG = resolveSlug();

  async function loadJson(url){
    const r = await fetch(url, { cache: 'no-cache' });
    if (!r.ok) throw new Error(url + ' ' + r.status);
    return r.json();
  }
  async function initPosthog(){
    try {
      const rt = await loadJson('/config/runtime.json');
      if (!rt.posthogKey || rt.posthogKey === 'REPLACE_ME' || !window.posthog) return;
      window.posthog.init(rt.posthogKey, {
        api_host: rt.posthogHost || 'https://us.i.posthog.com',
        person_profiles: 'identified_only',
        disable_session_recording: true,
        capture_pageview: true,
        autocapture: false
      });
    } catch (_) {}
  }

  (async () => {
    await initPosthog();
    let feed = null;
    try { feed = await loadJson('/clients/' + encodeURIComponent(SLUG) + '.json'); } catch (_) {}
    if (!feed || feed.template !== TEMPLATE){
      document.getElementById('swipe2-company').textContent = 'Not found';
      document.getElementById('swipe2-status').textContent = 'No swipe2 config for this link.';
      return;
    }
    document.getElementById('swipe2-company').textContent = feed.companyName || '';
    T.initTracking({ slug: SLUG, feed, isInternal: !!feed.isInternal, template: TEMPLATE });
    T.capture('page_open');
  })();
</script>
</body>
